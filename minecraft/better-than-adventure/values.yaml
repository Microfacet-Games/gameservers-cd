minecraft:
  image:
    tag: java17

  minecraftServer:
    eula: true

    version: "b1.7.3"
    type: "CUSTOM"

    whitelist: OneTrueDerpius,SgtPuggles,xandertron5000,SpankyBoi_

    forcegameMode: true
    motd: "The official TASBox BTA server - Better than GMod!"

    serviceType: "NodePort"
    nodePort: 30100

    memory: "4G"
    viewDistance: 15

  extraEnv:
    CUSTOM_SERVER: "https://downloads.betterthanadventure.net/bta-server/release/v8.0.1/bta.v8.0.1.server.jar"
    ENABLE_ROLLING_LOGS: true
    OVERRIDE_SERVER_PROPERTIES: true

  persistence:
    dataDir:
      enabled: true
      existingClaim: better-than-adventure-pvc
      Size: 8Gi

  resources:
    requests:
      memory: 4Gi
      cpu: 1
    limits:
      memory: 6Gi
      cpu: 8
